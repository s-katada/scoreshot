[package]
name = "scoreshot"
version = "0.1.0"
description = "ピアノ譜のエディタ"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "scoreshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"

# iOS のオーディオセッションを設定する (src/audio_session.rs)。
# どれも tao / wry が既に使っている版に揃えている
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
libc = "0.2"

# iOS 27 で画面が出ない問題 (#7) を直すため、tao 0.37 の UIScene 対応を 0.35.3 に
# 持ち込んだものを使う。Tauri 2 系は tao ^0.35 を要求していて 0.37 を使えない。
# iOS のファイルしか変えていないので、macOS の動きは 0.35.3 と同じ。
# Tauri 2 系が tao 0.37 以降に上がったら、これと patches/tao を消す (patches/README.md)
[patch.crates-io]
tao = { path = "patches/tao" }
