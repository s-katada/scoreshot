name: scoreshot
options:
  bundleIdPrefix: dev.katada.scoreshot
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: scoreshot
      PRODUCT_BUNDLE_IDENTIFIER: dev.katada.scoreshot
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  scoreshot_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: scoreshot_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: scoreshot_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: scoreshot_iOS/scoreshot_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          # Xcode のスクリプトフェーズは環境が消毒されており、nix の環境変数
          # (NIX_LDFLAGS など) も PATH も引き継がれない。そのままだと
          # proc-macro / build script のホストリンクが
          #   ld: library not found for -liconv
          # で落ちるため、dev シェルに入り直して実行する。
          #
          # その際の注意が 2 つ:
          #  - SDKROOT は Xcode が iOS 向けに設定している。残すとホスト側の
          #    リンクまで iOS の sysroot を見てしまうので env -u で外し、
          #    値は --sdk-root で明示的に渡す。
          #  - nix develop は独自の TMPDIR を作る。tauri の親プロセスは
          #    TMPDIR 配下のファイルで子と通信するため、元の値を復元する。
          set -e
          env -u SDKROOT nix develop "$SRCROOT/../../.." --command \
            sh -c 'export TMPDIR="$1"; shift; exec cargo tauri ios xcode-script -v "$@"' \
            _ "${TMPDIR:-/tmp}" \
              --platform "${PLATFORM_DISPLAY_NAME:?}" \
              --sdk-root "${SDKROOT:?}" \
              --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" \
              --header-search-paths "${HEADER_SEARCH_PATHS:?}" \
              --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" \
              --configuration "${CONFIGURATION:?}" \
              ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a